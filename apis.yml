name: Semmle
description: >-
  Semmle was a semantic code-analysis company whose engine let developers write
  queries (in its QL query language) to find security vulnerabilities and their
  variants across large codebases, and which powered the free open-source code
  review platform LGTM.com. Its technology was adopted by Uber, NASA, Microsoft,
  and Google. GitHub acquired Semmle in September 2019 and folded the QL engine
  into what is now CodeQL and GitHub code scanning; the standalone Semmle and
  LGTM.com products were retired and www.semmle.com now redirects to the GitHub
  acquisition announcement. This profile is retained as a historical (acquired)
  company lead in the API Evangelist network.
